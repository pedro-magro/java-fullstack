<!DOCTYPE html>
<html lang="en">
<head>

    <title>Nested HTML using React</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const nestedElement = (
            <div id ="root">
                <div id="parent">
                    <div id="child1">
                        <h1 style={{color: "blue"}}>Hi, I'm a student</h1>
                        <h2>I dunno what i'm doing</h2>
                    </div>
                    <div id="child2">

                        <h2>I also dunno what i'm seeing</h2>
                    </div>
                </div>
            </div>
        );

        const NestedFunction = () => (
            <div id ="root">
                <div id="parent">
                    <div id="child1">
                        <h1 style={{color: "blue"}}>Hi, I'm a student</h1>
                        <h2>I dunno what i'm doing</h2>
                    </div>
                    <div id="child2">
                        <h1 style={{color: "red"}}>Hi, I'm a teacher</h1>
                        <h2>I also dunno what i'm seeing</h2>
                    </div>
                </div>
            </div>
        );

        function PlainFunction() {
            return (
                <div id ="root">
                    <div id="parent">
                        <div id="child1">
                            <h1 style={{color: "blue"}}>Hi, I'm a student</h1>
                            <h2>I dunno what i'm doing</h2>

                            <h2>I also dunno what i'm seeing</h2>

        }

        const PlainFunctionElement = (
            <div id ="root">
                <div id="parent">
                    <div id="child1">
                        <h1 style={{color: "blue"}}>Hi, I'm a student</h1>

                    <div id="child2">
                        <h1 style={{color: "red"}}>Hi, I'm a teacher</h1>
                        <h2>I also dunno what i'm seeing</h2>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<PlainFunction/>);
    </script>


    
</body>
