<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested HTML using React</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div id="root"></div>
    <script src="./react-lib/react.development.js"></script>
    <script src="./react-lib/react-dom.development.js"></script>

    <script>

        const nestedElement = (
            <div id ="root">
                <div id="parent">
                    <div id="child1">
                        <h1 style={{color: "blue"}}>Hi, I'm a student</h1>
                        <h2>I dunno what i'm doing</h2>
                    </div>
                    <div id="child2">
                        <h1 style={{color: "red"}}>Hi, I'm a teacher</h1>
                        <h2>I also dunno what i'm seeing</h2>
                    </div>
                </div>
            </div>
        );
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(nestedElement);
    </script>


    
</body>
</html>
