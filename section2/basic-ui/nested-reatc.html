<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested HTML using React</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div id="root"></div>
    <script src="./react-lib/react.development.js"></script>
    <script src="./react-lib/react-dom.development.js"></script>

    <script>

        const nestedElement = React.createElement("div", { id: "parent" }, [
            React.createElement("div", { id: "child1" }, [
                React.createElement(
                    "h1",
                    {style: {color: "blue"}},
                    "Hi, I'm a student"
                ),
                React.createElement("h2", {}, "I dunno what i'm doing"),
            ]),
            React.createElement("div", { id: "child2"}, [
                React.createElement(
                    "h1",
                    {style: {color: "red"}},
                    "Hi, I'm a teacher"
                ),
               React.createElement("h2", {}, "I also dunno what i'm seeing"),
            ]),
        ]);
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(nestedElement);
    </script>


    
</body>
</html>
